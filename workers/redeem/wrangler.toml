name = "codequiz-redeem"
main = "src/index.ts"
compatibility_date = "2025-11-04"
workers_dev = true

# 国内可访问
# 管理台：https://redeem.xixi-cici.cn/admin
# 核销接口：https://redeem.xixi-cici.cn/redeem
[[routes]]
pattern = "redeem.xixi-cici.cn"
custom_domain = true

# ↓↓↓ 第 2 步创建 KV 后，把两个 id 贴到这里 ↓↓↓
[[kv_namespaces]]
binding = "REDEEM_USED"
id = "942f212590944ad2b08d3fb8323b5226"
preview_id = "e91b2fa371364a5caa6c2e40fd03f149"

# 有效兑换码（可在 Cloudflare 控制台改，不必改代码）
# 格式：码 或 码:次数
# 例：1111:3,2222:5,3333   → 1111用3次，2222用5次，3333用1次
[vars]
VALID_CODES = "1111:3,2222:5,3333:1"
